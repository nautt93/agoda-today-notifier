name: Test, build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          BOOKING_UI_SCREENSHOT_DIR: ${{ runner.temp }}/booking-popup-previews
          UI_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/booking-popup-previews
      - name: Save Windows popup previews
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-popup-previews
          path: |
            ${{ runner.temp }}/booking-popup-previews/*.png
            ${{ runner.temp }}/booking-popup-previews/synthetic-*-printed-a4.pdf
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: pyinstaller --noconfirm --clean BookingNotifier.spec
      - name: Verify packaged Booking.com browser driver
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "booking-browser-smoke.json"
          $proc = Start-Process "dist/Booking-Checkin-Hom-Nay.exe" -ArgumentList @('--booking-browser-smoke', ('"' + $report + '"')) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($proc.ExitCode -ne 0) { throw "Frozen Booking.com browser check failed" }
          $result = Get-Content $report | ConvertFrom-Json
          if (!$result.ok -or !$result.asynchronous_details_ready -or !$result.live_session_kept -or !$result.session_kept_after_window_close) { throw "Browser/session/detail readiness check did not complete" }
      - name: Verify packaged OTA and application restart
        run: python scripts/smoke_packaged_update.py dist/Booking-Checkin-Hom-Nay.exe
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-windows-exe
          path: dist/Booking-Checkin-Hom-Nay.exe
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-windows-exe
          path: dist
      - name: Name release asset
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Move-Item "dist/Booking-Checkin-Hom-Nay.exe" "dist/Booking-Checkin-Hom-Nay-$version.exe"
      - name: Authenticode sign when a trusted certificate is configured
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $asset = Get-ChildItem "dist/*.exe" | Select-Object -First 1
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD $asset.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $pfx -Force
          } else {
            Write-Host "No Authenticode certificate configured; continuing unsigned."
          }
      - name: Create signed OTA manifest
        shell: pwsh
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $asset = "dist/Booking-Checkin-Hom-Nay-$version.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Booking-Checkin-Hom-Nay-$version.exe"
          python scripts/make_release_manifest.py --version $version --asset $asset --url $url --notes "Sửa toàn bộ luồng bổ sung thông báo Booking.com: lưu đúng ngày, hiện form khi app ẩn xuống khay, popup không cắt hướng dẫn, bổ sung được booking thiếu link và booking đã đóng thông báo. Kiểm tra tổng tiền hợp lệ; cập nhật họ tên, phòng/số lượng, ngày trả và 9 cột Excel mà không phát chuông hoặc báo lại. Thư newsletter/nhắc thanh toán/yêu cầu đánh giá Booking.com được đọc một lần; mẫu booking mới lỗi vẫn thử lại. Mặc định thủ công, không chạy web ẩn. Giữ tài khoản, lịch sử, UID, âm thanh và giờ yên lặng. Đã kiểm thử thao tác lưu thật từ popup khi ẩn xuống khay, chống trùng và ba hồ sơ OTA cũ." --output dist/update.json
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" "dist/Booking-Checkin-Hom-Nay-$version.exe" "dist/update.json" --title "Booking Check-in Hôm nay ${{ github.ref_name }}" --generate-notes
      - name: Publish signed OTA manifest to main
        shell: bash
        run: |
          cp dist/update.json /tmp/update.json
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          cp /tmp/update.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "Publish OTA ${{ github.ref_name }}"
          git push origin main
