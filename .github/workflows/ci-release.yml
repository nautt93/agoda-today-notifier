name: Test, build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          BOOKING_UI_SCREENSHOT_DIR: ${{ runner.temp }}/booking-popup-previews
      - name: Save Windows popup previews
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-popup-previews
          path: ${{ runner.temp }}/booking-popup-previews/*.png
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: pyinstaller --noconfirm --clean BookingNotifier.spec
      - name: Verify packaged OTA and application restart
        run: python scripts/smoke_packaged_update.py dist/Booking-Checkin-Hom-Nay.exe
      - name: Name release asset
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Move-Item "dist/Booking-Checkin-Hom-Nay.exe" "dist/Booking-Checkin-Hom-Nay-$version.exe"
      - name: Authenticode sign when a trusted certificate is configured
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $asset = Get-ChildItem "dist/*.exe" | Select-Object -First 1
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD $asset.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $pfx -Force
          } else {
            Write-Host "No Authenticode certificate configured; continuing unsigned."
          }
      - name: Create signed OTA manifest
        shell: pwsh
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $asset = "dist/Booking-Checkin-Hom-Nay-$version.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Booking-Checkin-Hom-Nay-$version.exe"
          python scripts/make_release_manifest.py --version $version --asset $asset --url $url --notes "Âm thanh MP3/WAV riêng cho Agoda và Expedia trong Cài đặt, có Chọn tệp và Nghe thử từng nguồn, tự dừng nghe thử sau 4 giây. Phát đúng file theo nguồn popup và lặp đến khi đóng thông báo; Sao chép/ẩn khay không dừng âm báo. Giữ file chung cũ làm dự phòng; có hai file WAV mặc định khác nhau nếu chưa chọn file. Booking đến luôn ưu tiên hơn nghe thử, không ngắt âm báo booking đang chờ, hủy hẹn giờ cũ để không chồng chuông. File lỗi chuyển dự phòng, popup vẫn mở. Giữ đầy đủ tên/phòng, Excel 9 cột, chỉ báo booking mới check-in hôm nay, F92 và OTA an toàn." --output dist/update.json
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" "dist/Booking-Checkin-Hom-Nay-$version.exe" "dist/update.json" --title "Booking Check-in Hôm nay ${{ github.ref_name }}" --generate-notes
      - name: Publish signed OTA manifest to main
        shell: bash
        run: |
          cp dist/update.json /tmp/update.json
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          cp /tmp/update.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "Publish OTA ${{ github.ref_name }}"
          git push origin main
