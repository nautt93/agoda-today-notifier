[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-checkin-hom-nay"
version = "1.7.15"
description = "Windows notifier for Agoda and Expedia bookings checking in today"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
  "Pillow==12.3.0",
  "pyserial==3.5",
  "pystray==0.19.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
  "ruff==0.13.2",
]

[tool.setuptools.packages.find]
include = ["booking_notifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
